version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: connpet-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin 
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - connpet-net

networks:
  connpet-net:
    driver: bridge
